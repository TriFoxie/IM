<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=“utf-8”>
        <link rel="stylesheet" href="../global.css">
        <link rel="stylesheet" href="clock.css">
        <script type="text/javascript" src="clock.js" defer></script>
        <title>IM-Clock</title>
    </head>
    <body>
    <div id="content">
        <button id="mute_button" onclick="toggleSound()"><img id="mute_icon" src="Assets/Images/mute.svg" alt="toggle sound" width="16" height="16"/></button>
        <div id="clock">
            <audio id="tick" hidden title="tick"><source src="Assets/Audio/tick.mp3"></audio>
            <div id="hour"></div>
            <div id="min"></div>
            <div id="sec"></div>
        </div>
    </div>
    <div class="nav_menu">
        <img id="logo" src="../Assets/Cookie.svg" alt="cookie logo">
        <!-- Modify links when pasting, use deferred loading -->
        <div id="desktop_nav_menu">
            <ul>
                <li><a href="/IM">Home</a></li>
                <li><a href="/IM/Video">Video</a></li>
                <li><a href="/IM/Activities">Activities</a></li>
                <li><a href="/IM/Coursework">Coursework</a></li>
                <li class="current_page">Clock</li>
            </ul>
        </div>
        <div id="mobile_nav_menu">
            <ul>
                <li><a href="/IM"><img src="../Assets/Home.svg" alt="Home"></a></li>
                <li><a href="/IM/Video"><img src="../Assets/Clapper.svg" alt="Video"></a></li>
                <li><a href="/IM/Activities"><img src="../Assets/Dice.svg" alt="Activities"></a></li>
                <li><a href="/IM/Coursework"><img src="../Assets/Pencil.svg" alt="Coursework"></a></li>
                <li class="current_page"><img src="../Assets/Clock.svg" alt="Clock"></li>
            </ul>
        </div>
    </div>
    <script src="../navMenu.js" defer></script>
    </body>
</html>
